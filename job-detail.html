<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジョブ詳細 - FF14 Skill Archive</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <a href="jobs.html" class="back-link">← 戻る</a>
        <h1 id="job-name"></h1>
    </header>

    <main>
        <!-- 並び替えコントロール -->
        <div class="skill-controls">
            <label>
                レベル順:
                <select id="level-sort">
                    <option value="asc">昇順 (低 → 高)</option>
                    <option value="desc">降順 (高 → 低)</option>
                </select>
            </label>
            <label>
                種別配置:
                <select id="type-order">
                    <option value="gcd-top">WS 上 / アビ 下</option>
                    <option value="ogcd-top">アビ 上 / WS 下</option>
                    <option value="pure-level" selected>タイプ分けせずレベル順</option>
                </select>
            </label>
        </div>

        <!-- ジョブスキル領域 -->
        <h2 id="job-title">ジョブスキル</h2>
        <div id="job-skill-list" class="grid"></div>

        <!-- ジョブ専用システム（忍者・占星術師など） -->
        <div id="special-system-section" style="display: none;">
            <h2 id="special-system-title">固有システム</h2>
            <div id="special-system-content"></div>
        </div>

        <!-- ロールスキル領域 -->
        <h2 id="role-title">ロールスキル</h2>
        <div id="class-skill-list" class="grid"></div>

        <h2 id="magic-title">魔法スキル</h2>
        <div id="magic-skill-list" class="grid"></div>

        <!-- コンボ領域 -->
        <h2>コンボ</h2>
        <div id="combo-list"></div>

        <h3 id="upgrade-title">スキル強化</h3>
        <div id="upgrade-list"></div>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
