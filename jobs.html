<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジョブ一覧 - FF14 Skill Archive</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← トップに戻る</a>
        <h1>ジョブ一覧</h1>
    </header>

    <!-- 距離・範囲の見方ガイド -->
    <div class="battle-guide">
        <span class="guide-title">📖 バトルデータの見方</span>
        <div class="guide-items">
            <div class="guide-item">
                <span class="guide-icon long-range">🡨🡪 射程</span>
                <span class="guide-desc">対象（敵など）に届く距離。数値が大きいほど遠くから攻撃できます。</span>
            </div>
            <div class="guide-item">
                <span class="guide-icon aoe-badge">◯ 範囲</span>
                <span class="guide-desc">技が当たったとき、周囲に広がる効果の広さ（半径）。「単体」は1体にのみ当たります。</span>
            </div>
        </div>
    </div>
    
    <!-- ミニゲーム1：サボテンダー討伐戦 --
    <section class="minigame-section">
        <h3>🌵 おまけ：サボテンダー討伐戦（10秒連打チャレンジ）</h3>
        <p>制限時間内に針千本を撃たれる前に、サボテンダーをボコボコにしろ！</p>
        
        <div class="mokujin-container">
            <!-- ステータス表示 --
            <div class="minigame-status">
                残り時間: <span id="time-left">10</span>秒 | ダメージ数: <span id="score">0</span>
            </div>
            
            <!-- 結果発表専用ボックス --
            <div id="game-result-msg" class="mokujin-result-box">「スタート」を押してバトル開始！</div>

            <!-- ボタン配置エリア（連打用とリセット用を分離） --
            <div class="mokujin-action-area">
                <!-- メインの連打ボタン --
                <button id="punch-btn" class="mokujin-punch-btn" onclick="punchMokujin()" disabled>サボテンダーを殴る！</button>
                
                <!-- 右側に配置したリセット（もう一度）ボタン --
                <button id="reset-btn" class="mokujin-reset-btn" onclick="startMokujinGame()">スタート</button>
            </div>
        </div>
    </section>
    -->
    <main>
        <h2>タンク</h2>
        <div id="tank-list" class="job-grid"></div>

        <h2>ヒーラー</h2>
        <div id="healer-list" class="job-grid"></div>

        <h2>Melee (近接物理DPS)</h2>
        <div id="melee-list" class="job-grid"></div>

        <h2>Ranged (遠隔物理DPS)</h2>
        <div id="ranged-list" class="job-grid"></div>

        <h2>Caster (遠隔魔法DPS)</h2>
        <div id="caster-list" class="job-grid"></div>
    </main>

    <!-- サボテンダー討伐戦用のJavaScript --
    <script>
        let isMokujinPlaying = false;
        let mokujinScore = 0;
        let mokujinTimeLeft = 10;
        let mokujinTimer = null;

        function startMokujinGame() {
            const punchBtn = document.getElementById("punch-btn");
            const resetBtn = document.getElementById("reset-btn");
            const resultBox = document.getElementById("game-result-msg");
            const scoreSpan = document.getElementById("score");
            const timeLeftSpan = document.getElementById("time-left");

            // プレイ中の場合はリセット
            if (isMokujinPlaying) {
                clearInterval(mokujinTimer);
                isMokujinPlaying = false;
                
                if (punchBtn) punchBtn.disabled = true;
                if (resetBtn) resetBtn.textContent = "スタート";
                if (scoreSpan) scoreSpan.textContent = "0";
                if (timeLeftSpan) timeLeftSpan.textContent = "10";
                if (resultBox) resultBox.textContent = "リセットしました。「スタート」を押してね！";
                return;
            }

            // 初期化 & バトル開始
            isMokujinPlaying = true;
            mokujinScore = 0;
            mokujinTimeLeft = 10;

            if (punchBtn) punchBtn.disabled = false;
            if (resetBtn) resetBtn.textContent = "リセット";
            
            if (scoreSpan) scoreSpan.textContent = mokujinScore;
            if (timeLeftSpan) timeLeftSpan.textContent = mokujinTimeLeft;
            if (resultBox) resultBox.textContent = "チクチク痛い！連打で押し切れ…！";

            // タイマー開始
            if (mokujinTimer) clearInterval(mokujinTimer);
            mokujinTimer = setInterval(() => {
                mokujinTimeLeft--;
                if (timeLeftSpan) timeLeftSpan.textContent = mokujinTimeLeft;

                if (mokujinTimeLeft <= 0) {
                    clearInterval(mokujinTimer);
                    isMokujinPlaying = false;
                    
                    if (punchBtn) punchBtn.disabled = true;
                    if (resetBtn) resetBtn.textContent = "もう一度遊ぶ";
                    
                    const dps = (mokujinScore / 10).toFixed(1);
                    if (resultBox) {
                        if (mokujinScore >= 60) {
                            resultBox.textContent = `討伐成功！ 針千本を阻止した！ スコア: ${mokujinScore} (DPS: ${dps})`;
                        } else {
                            resultBox.textContent = `ぐふっ…針千本を喰らった！ スコア: ${mokujinScore} (DPS: ${dps})`;
                        }
                    }
                }
            }, 1000);
        }

        function punchMokujin() {
            if (!isMokujinPlaying) return;

            mokujinScore++;
            const scoreSpan = document.getElementById("score");
            if (scoreSpan) scoreSpan.textContent = mokujinScore;
        }
    </script>
    -->

    <script src="assets/js/job-list.js"></script>
</body>
</html>
