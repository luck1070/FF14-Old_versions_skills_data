<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 スキルデータベース</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <h1>FF14 スキルデータベース</h1>
    </header>
    
    <main class="container">
        <h2>閲覧するバージョンを選択してください</h2>
        <div class="version-select-grid" style="display: flex; gap: 15px; margin-bottom: 30px;">
            <a href="jobs.html?v=7.5" class="version-card">
                <h3>パッチ 7.5（現行）</h3>
            </a>

            <a>
                <h3>coming soon....</h3>
            </a>
            <!--
            <a href="jobs.html?v=8.0" class="version-card">
                <h3>パッチ 8.0（最新）</h3>
            </a>
            -->
        </div>

        <!-- ミニゲーム：本日のシャキ待ち・ジョブガチャ -->
        <section class="minigame-section">
            <h3>🎲 本日のシャキ待ち・ジョブガチャ</h3>
            <p>どのジョブでコンテンツ申請するか迷ったら、運命に委ねてみよう！</p>
            
            <!-- 拡張パッケージ（進行度）による制限フィルター -->
            <div style="margin-bottom: 15px;">
                <label for="expansion-select" style="font-weight: bold; margin-right: 5px; color: #aaa; font-size: 13px;">対象ジョブ制限：</label>
                <select id="expansion-select" style="background-color: #1a1a1a; color: #e0e0e0; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; font-size: 13px;">
                    <option value="dt" selected>🌟 すべてのジョブ (ALL / 黄金まで)</option>
                    <option value="arr">🌱 新生エオルゼアのみ (Lv50)</option>
                    <option value="hw">🛡️ 蒼天のイシュガルドまで (Lv60)</option>
                    <option value="sb">⚔️ 紅蓮のリベレーターまで (Lv70)</option>
                    <option value="shb">🔮 漆黒のヴィランズまで (Lv80)</option>
                    <option value="ew">🌙 暁月のフィナーレまで (Lv90)</option>
                </select>
            </div>

            <button id="job-gacha-btn" class="minigame-btn" onclick="drawRandomJob()">運命のジョブを引く</button>
            
            <div id="job-gacha-result" class="minigame-result"></div>
        </section>
    </main>

    <!-- ジョブガチャ用のJavaScript -->
    <script>
        const jobPools = {
            arr: [
                "ナイト (PLD)", "戦士 (WAR)", "白魔道士 (WHM)", "学者 (SCH)", 
                "モンク (MNK)", "竜騎士 (DRG)", "忍者 (NIN)", "吟遊詩人 (BRD)", 
                "黒魔道士 (BLM)", "召喚士 (SMN)"
            ],
            hw: [ // 蒼天で追加
                "暗黒騎士 (DRK)", "占星術師 (AST)", "機工士 (MCH)"
            ],
            sb: [ // 紅蓮で追加
                "侍 (SAM)", "赤魔道士 (RDM)"
            ],
            shb: [ // 漆黒で追加
                "ガンブレイカー (GNB)", "踊り子 (DNC)"
            ],
            ew: [ // 暁月で追加
                "リーパー (RPR)", "賢者 (SGE)"
            ],
            dt: [ // 黄金で追加
                "ヴァイパー (VPR)", "ピクトマンサー (PCT)"
            ]
        };

        // 選択された進行度までのジョブリストを累積して生成する関数
        function getAvailableJobs(maxExpansion) {
            let available = [];
            const order = ["arr", "hw", "sb", "shb", "ew", "dt"];
            
            for (let i = 0; i < order.length; i++) {
                const key = order[i];
                if (jobPools[key]) {
                    available = available.concat(jobPools[key]);
                }
                if (key === maxExpansion) break;
            }
            return available;
        }

        function drawRandomJob() {
            const resultDiv = document.getElementById("job-gacha-result");
            const btn = document.getElementById("job-gacha-btn");
            
            // セレクトボックスから選択値を取得（デフォルトはすべての "dt"）
            const selectElement = document.getElementById("expansion-select");
            const currentExpansion = selectElement ? selectElement.value : "dt";
            
            // 進行度に応じたプールを取得
            const currentJobs = getAvailableJobs(currentExpansion);

            if (currentJobs.length === 0) {
                resultDiv.textContent = "⚠️ 抽選できるジョブがありません";
                return;
            }
            
            btn.disabled = true;
            resultDiv.textContent = "シャカシャカシャカ……";

            let count = 0;
            const interval = setInterval(() => {
                const randomTempJob = currentJobs[Math.floor(Math.random() * currentJobs.length)];
                resultDiv.textContent = randomTempJob;
                count++;
                
                if (count > 30) {
                    clearInterval(interval);
                    const finalJob = currentJobs[Math.floor(Math.random() * currentJobs.length)];
                    resultDiv.textContent = `🎯 運命のジョブ： 【 ${finalJob} 】`;
                    btn.disabled = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
