<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ジョブ一覧 - FF14 Skill Archive</title>
	<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

	<header>
		<a href="index.html" class="back-link">← トップに戻る</a>
		<h1>ジョブ一覧</h1>
	</header>

	<!-- 距離・範囲の見方ガイド -->
	<div class="battle-guide">
		<span class="guide-title">📖 バトルデータの見方</span>
		<div class="guide-items">
			<div class="guide-item">
				<span class="guide-icon long-range">🡨🡪 射程</span>
				<span class="guide-desc">対象（敵など）に届く距離。数値が大きいほど遠くから攻撃できます。</span>
			</div>
			<div class="guide-item">
				<span class="guide-icon aoe-badge">◯ 範囲</span>
				<span class="guide-desc">技が当たったとき、周囲に広がる効果の広さ（半径）。「単体」は1体にのみ当たります。</span>
			</div>
		</div>
	</div>

	<main>
		<h2>タンク</h2>
		<div id="tank-list" class="job-grid"></div>

		<h2>ヒーラー</h2>
		<div id="healer-list" class="job-grid"></div>

		<h2>Melee (近接物理DPS)</h2>
		<div id="melee-list" class="job-grid"></div>

		<h2>Ranged (遠隔物理DPS)</h2>
		<div id="ranged-list" class="job-grid"></div>

		<h2>Caster (遠隔魔法DPS)</h2>
		<div id="caster-list" class="job-grid"></div>
	</main>

	<script src="assets/js/job-list.js"></script>
</body>
</html>
